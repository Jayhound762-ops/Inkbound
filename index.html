<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>INKBOUND — Fanfiction Studio</title>
<style>
:root{color-scheme:dark;--bg:#100f16;--panel:#191722;--panel2:#211f2d;--line:#343044;--text:#f5f1ff;--muted:#aaa4bb;--accent:#c59aff;--accent2:#8c5ce8;--good:#9be2be;--warn:#ffce8b;--danger:#ff9da8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100dvh;max-width:920px;margin:auto;padding-bottom:88px}.top{position:sticky;top:0;z-index:5;background:#100f16ed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 17px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#d5b3ff,#8251df);display:grid;place-items:center;color:#171020;font-weight:900;font-size:18px}.brand strong{letter-spacing:.13em;font-size:13px}.brand small{display:block;color:var(--muted);letter-spacing:.02em;font-size:11px}.pill{font-size:11px;border:1px solid #5e4c7e;color:#d9c3ff;border-radius:99px;padding:5px 9px}.content{padding:18px 16px}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:750}.hero{padding:8px 0 19px}.hero h1{font-size:30px;line-height:1.12;letter-spacing:-.04em;margin:9px 0}.hero p{color:var(--muted);max-width:600px;margin:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0}.card h2,.card h3{margin:0 0 8px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 13px;font-weight:650}.btn.primary{background:var(--accent);color:#1c1329;border-color:var(--accent)}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.btn:active{transform:scale(.98)}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#100f17;color:var(--text);border-radius:11px;padding:12px;outline:none}.field textarea{resize:vertical;min-height:95px}.field input:focus,.field textarea:focus{border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--panel2);border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#15131df5;border-top:1px solid var(--line);backdrop-filter:blur(16px);max-width:920px;margin:auto}.nav button{border:0;background:transparent;color:var(--muted);padding:7px 2px;border-radius:10px;font-size:10px}.nav button span{display:block;font-size:19px;margin-bottom:3px}.nav button.active{color:var(--accent);background:#302442}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 9px}.item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.cover{width:44px;height:54px;border-radius:8px;background:linear-gradient(145deg,#46315e,#1e1b2b);display:grid;place-items:center;font-size:20px;flex-shrink:0}.item-main{flex:1;min-width:0}.item-main strong{display:block;overflow-wrap:anywhere}.tag{display:inline-block;font-size:10px;padding:3px 7px;border-radius:6px;background:#30263f;color:#d7bcff;margin:4px 4px 0 0}.empty{text-align:center;padding:28px 14px;color:var(--muted)}.empty .symbol{font-size:30px;margin-bottom:8px}.chatlog{display:flex;flex-direction:column;gap:10px;margin:14px 0}.bubble{max-width:95%;padding:12px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.assistant{background:var(--panel2);border:1px solid var(--line);align-self:flex-start}.bubble.user{background:#3b2b53;align-self:flex-end}.composer{position:sticky;bottom:78px;background:var(--bg);padding:9px 0}.composer textarea{width:100%;min-height:85px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text)}.notice{border-left:3px solid var(--warn);background:#2b241b;padding:11px 12px;border-radius:0 10px 10px 0;color:#f4d8b2;font-size:12px;margin:12px 0}.success{border-left-color:var(--good);background:#182920;color:#c3f2d8}.hidden{display:none!important}.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 8px}.tabs button{white-space:nowrap}.active-tab{border-color:var(--accent);color:var(--accent)}.count{font-size:11px;color:var(--muted)}.draft{min-height:300px!important;line-height:1.7;font-family:Georgia,serif}.rule{border-top:1px solid var(--line);margin:15px 0}
@media(min-width:700px){.content{padding:25px 28px}.hero h1{font-size:39px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:16px 16px 0 0}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">I</div><div><strong>INKBOUND</strong><small>YOUR FANFICTION STUDIO</small></div></div><span class="pill">LOCAL MODE</span></header>
<main class="content" id="view"></main>
<nav class="nav">
<button data-page="home" class="active"><span>⌂</span>Home</button>
<button data-page="projects"><span>▤</span>Stories</button>
<button data-page="write"><span>✎</span>Write</button>
<button data-page="lore"><span>◈</span>Lore vault</button>
<button data-page="settings"><span>⚙</span>Settings</button>
</nav>
</div>
<script>
const KEY='inkbound-v1';
const fresh=()=>({projects:[],active:null,notes:[],drafts:[],chat:[],settings:{tone:'Cinematic, gritty, emotionally grounded',length:'Long chapter',pov:'Third person limited'}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){db=fresh()}
let page='home',loreTab='characters';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Phone storage is full. Export your backup in Settings.');return false}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const active=()=>db.projects.find(p=>p.id===db.active)||null;
const wordCount=s=>(s.trim().match(/\S+/g)||[]).length;
function nav(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function render(){const v=document.getElementById('view');if(page==='home')v.innerHTML=home();if(page==='projects')v.innerHTML=projects();if(page==='write')v.innerHTML=write();if(page==='lore')v.innerHTML=lore();if(page==='settings')v.innerHTML=settings();bind()}
function home(){let p=active();return `<section class="hero"><div class="eyebrow">THE WRITER'S ROOM</div><h1>Your worlds.<br>Your rules.</h1><p>A private workspace for fanfiction, alternate universes, character lore, and chapters that stay yours.</p></section>
<div class="grid"><div class="stat"><b>${db.projects.length}</b><span>STORY PROJECTS</span></div><div class="stat"><b>${db.notes.filter(n=>n.type==='Character').length}</b><span>CHARACTERS</span></div><div class="stat"><b>${db.drafts.length}</b><span>SAVED DRAFTS</span></div><div class="stat"><b>${db.notes.length}</b><span>LORE ENTRIES</span></div></div>
<div class="card"><div class="row between"><h2>Continue writing</h2><button class="btn ghost" data-go="projects">All stories ↗</button></div>${p?`<div class="item"><div class="cover">✦</div><div class="item-main"><strong>${esc(p.title)}</strong><div class="muted small">${esc(p.fandom||'Original AU')} · Updated ${new Date(p.updated).toLocaleDateString()}</div><span class="tag">${esc(p.status||'In progress')}</span></div><button class="btn" data-go="write">Open</button></div>`:`<div class="empty"><div class="symbol">✧</div><strong>Your first universe starts here.</strong><p>Create a story project to give its canon, rules, and characters a home.</p><button class="btn primary" data-action="new-project">Create a story</button></div>`}</div>
<div class="card"><h2>Studio status</h2><div class="notice">The current build is an offline-first foundation, not a connected generative AI yet. Your notes and drafts stay in this browser on this device. We'll add a genuinely free AI route only after confirming its limits and privacy.</div><div class="row between"><span class="muted small">Autosave</span><span class="tag">ON · This device</span></div></div>
<div class="card"><h2>Build roadmap</h2><p class="small muted">✓ Project workspace and local saving</p><p class="small muted">✓ Character and lore vault</p><p class="small muted">✓ Draft editor and basic continuity scan</p><p class="small muted">○ AI model connection</p><p class="small muted">○ Import/export and installable app setup</p></div>`}
function projects(){return `<div class="hero"><div class="eyebrow">YOUR LIBRARY</div><h1>Story projects</h1><p>Keep every AU in its own lane. One project's facts should never silently leak into another.</p></div><button class="btn primary" data-action="new-project">＋ New project</button><div class="card">${db.projects.length?db.projects.map(p=>`<div class="item"><div class="cover">✦</div><div class="item-main"><strong>${esc(p.title)}</strong><div class="muted small">${esc(p.fandom||'No fandom set')} · ${esc(p.premise||'No premise yet')}</div><span class="tag">${esc(p.status||'In progress')}</span></div><button class="btn" data-open="${p.id}">Open</button></div>`).join(''):`<div class="empty"><div class="symbol">▤</div><strong>No stories yet</strong><p>Create a project to start your first AU.</p></div>`}</div>${active()?`<button class="btn danger" data-action="delete-project">Delete active project</button>`:''}`}
function write(){let p=active();if(!p)return `<div class="hero"><div class="eyebrow">THE MANUSCRIPT</div><h1>Writing desk</h1><p>Choose or create a story first. Drafts are stored separately from your lore notes.</p></div><button class="btn primary" data-go="projects">Go to stories</button>`;
let d=db.drafts.find(x=>x.project===p.id);return `<div class="hero"><div class="eyebrow">NOW WRITING</div><h1>${esc(p.title)}</h1><p>${esc(p.fandom||'Fanfiction')} · Your words, saved locally.</p></div>
<div class="tabs"><button class="btn active-tab">Draft editor</button><button class="btn" data-action="new-draft">＋ New draft</button></div>
<div class="field"><label>CHAPTER / SCENE TITLE</label><input id="draft-title" value="${esc(d?.title||'Untitled scene')}" placeholder="Chapter title"></div>
<div class="field"><label>MANUSCRIPT</label><textarea class="draft" id="draft-body" placeholder="Start with a sound, a choice, a consequence…">${esc(d?.body||'')}</textarea><div class="row between"><span class="count" id="wc">${wordCount(d?.body||'')} words</span><button class="btn primary" data-action="save-draft">Save draft</button></div></div>
<div class="card"><h3>Scene workbench</h3><p class="small muted">Use this to shape a scene before drafting. This starter version doesn't pretend to generate prose with an AI model.</p>
<div class="field"><label>WHAT HAPPENS IN THIS SCENE?</label><textarea id="scene-goal" placeholder="The character wants… but…"></textarea></div><div class="field"><label>EMOTIONAL UNDERCURRENT</label><input id="scene-emotion" placeholder="e.g. anger covering fear"></div><div class="field"><label>NON-NEGOTIABLE CONTINUITY FACT</label><input id="scene-fact" placeholder="e.g. nobody knows the secret yet"></div><button class="btn" data-action="scene-brief">Build scene brief</button><div id="scene-result"></div></div>
<div class="card"><h3>Quick continuity scan</h3><p class="small muted">A first-pass check for missing project lore and repeated wording. It cannot yet understand story meaning like a capable language model.</p><button class="btn" data-action="scan">Scan current draft</button><div id="scan-result"></div></div>`}
function lore(){let p=active();let list=db.notes.filter(n=>!p||n.project===p.id);return `<div class="hero"><div class="eyebrow">CANON IS LAW</div><h1>Lore vault</h1><p>Record what is true, what is secret, and who has actually learned it.</p></div><div class="row between"><div class="tabs">${['Character','World rule','Timeline','Relationship','Secret'].map(t=>`<button class="btn ${loreTab===t?'active-tab':''}" data-loretab="${t}">${t}</button>`).join('')}</div></div>
<div class="card"><h3>Add ${esc(loreTab.toLowerCase())}</h3><div class="field"><label>NAME / EVENT</label><input id="lore-name" placeholder="${loreTab==='Timeline'?'e.g. First day at U.A.':'Entry title'}"></div><div class="field"><label>DETAILS / ESTABLISHED FACTS</label><textarea id="lore-detail" placeholder="What is canon in this version?"></textarea></div>${loreTab==='Secret'?`<div class="field"><label>WHO KNOWS?</label><input id="lore-knows" placeholder="Names of characters who know this"></div>`:''}<button class="btn primary" data-action="add-lore">Save lore entry</button></div>
<div class="section-title"><h2>Saved entries</h2><span class="count">${list.length}</span></div><div class="card">${list.length?list.map(n=>`<div class="item"><div class="cover">${n.type==='Character'?'♙':n.type==='Timeline'?'◷':n.type==='Secret'?'◉':'◇'}</div><div class="item-main"><strong>${esc(n.name)}</strong><span class="tag">${esc(n.type)}</span><p class="small">${esc(n.detail)}</p>${n.knows?`<p class="small muted">Knows: ${esc(n.knows)}</p>`:''}</div><button class="btn danger" data-remove-note="${n.id}">×</button></div>`).join(''):`<div class="empty">No lore entries yet. Add the facts you refuse to let the story forget.</div>`}</div>`}
function settings(){return `<div class="hero"><div class="eyebrow">STUDIO SETTINGS</div><h1>Make it yours</h1><p>Your preferences and your backup controls.</p></div><div class="card"><h3>Writing defaults</h3><div class="field"><label>DEFAULT TONE</label><input id="set-tone" value="${esc(db.settings.tone)}"></div><div class="field"><label>CHAPTER LENGTH</label><select id="set-length">${['Short scene','Medium chapter','Long chapter','Very long chapter'].map(x=>`<option ${db.settings.length===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>POINT OF VIEW</label><select id="set-pov">${['Third person limited','First person','Third person omniscient','Alternating POV'].map(x=>`<option ${db.settings.pov===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn primary" data-action="save-settings">Save preferences</button></div>
<div class="card"><h3>Backup & privacy</h3><p class="small muted">Data is saved in this browser's local storage. Clearing browser data can erase it; use backups regularly. Local storage is not encrypted.</p><div class="row" style="flex-wrap:wrap"><button class="btn primary" data-action="export">Export backup (.json)</button><label class="btn">Import backup<input type="file" id="import-file" accept="application/json" hidden></label></div><div class="rule"></div><button class="btn danger" data-action="wipe">Erase all local data</button></div>
<div class="card"><h3>AI engine status</h3><div class="notice">No AI API, paid service, or external server is connected in this version. The interface is ready to grow, but generating high-quality prose requires a model running locally or an available free service. Any free service can have usage limits or change its terms.</div></div>
<div class="card"><h3>Next: publish as an iPhone web app</h3><p class="small muted">The $0 path is to place this project in a GitHub repository and publish it with GitHub Pages, then open it in Safari and choose Add to Home Screen. This creates an app-like web app, not an App Store native app.</p></div>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{db.active=b.dataset.open;save();nav('home')});document.querySelectorAll('[data-loretab]').forEach(b=>b.onclick=()=>{loreTab=b.dataset.loretab;render()});document.querySelectorAll('[data-remove-note]').forEach(b=>b.onclick=()=>{db.notes=db.notes.filter(n=>n.id!==b.dataset.removeNote);save();render()});
const body=document.getElementById('draft-body');if(body)body.oninput=()=>{document.getElementById('wc').textContent=wordCount(body.value)+' words';let d=db.drafts.find(x=>x.project===active()?.id);if(d){d.body=body.value;save()}};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
const file=document.getElementById('import-file');if(file)file.onchange=async()=>{try{const x=JSON.parse(await file.files[0].text());if(!x.projects||!x.notes||!x.drafts)throw Error();db=x;save();render();alert('Backup imported.')}catch(e){alert('That backup file could not be read.')}};
}
function action(a){
if(a==='new-project'){let title=prompt('Story / AU title?');if(!title?.trim())return;let fandom=prompt('Fandom(s)?','My Hero Academia')||'';let premise=prompt('One-line premise (optional):','')||'';let p={id:crypto.randomUUID(),title:title.trim(),fandom,premise,status:'In progress',created:Date.now(),updated:Date.now()};db.projects.push(p);db.active=p.id;save();nav('home')}
if(a==='delete-project'){let p=active();if(!p||!confirm(`Delete "${p.title}" and its drafts and lore? Export a backup first if you may want it later.`))return;db.projects=db.projects.filter(x=>x.id!==p.id);db.notes=db.notes.filter(x=>x.project!==p.id);db.drafts=db.drafts.filter(x=>x.project!==p.id);db.active=db.projects[0]?.id||null;save();render()}
if(a==='new-draft'){let p=active();if(!p)return;let d={id:crypto.randomUUID(),project:p.id,title:'Untitled scene',body:'',updated:Date.now()};db.drafts.unshift(d);save();render()}
if(a==='save-draft'){let p=active();if(!p)return;let d=db.drafts.find(x=>x.project===p.id);if(!d){d={id:crypto.randomUUID(),project:p.id,title:'Untitled scene',body:''};db.drafts.unshift(d)}d.title=document.getElementById('draft-title').value;d.body=document.getElementById('draft-body').value;d.updated=Date.now();p.updated=Date.now();save();alert('Draft saved on this device.')}
if(a==='add-lore'){let name=document.getElementById('lore-name').value.trim(),detail=document.getElementById('lore-detail').value.trim();if(!name||!detail){alert('Add a name and details first.');return}db.notes.unshift({id:crypto.randomUUID(),project:active()?.id||null,type:loreTab,name,detail,knows:document.getElementById('lore-knows')?.value||'',created:Date.now()});save();render()}
if(a==='save-settings'){db.settings={tone:document.getElementById('set-tone').value,length:document.getElementById('set-length').value,pov:document.getElementById('set-pov').value};save();alert('Preferences saved.')}
if(a==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='inkbound-backup.json';a.click();URL.revokeObjectURL(url)}
if(a==='wipe'){if(confirm('Permanently erase all INKBOUND data stored in this browser? Export a backup first if needed.')){db=fresh();save();render()}}
if(a==='scene-brief'){let goal=document.getElementById('scene-goal').value,emotion=document.getElementById('scene-emotion').value,fact=document.getElementById('scene-fact').value,p=active();document.getElementById('scene-result').innerHTML=`<div class="notice success"><b>SCENE BRIEF</b><br>Project: ${esc(p?.title||'')}<br>Goal: ${esc(goal||'Define the scene objective')}<br>Emotional undercurrent: ${esc(emotion||'Choose a subtext')}<br>Continuity constraint: ${esc(fact||'Check the lore vault')}<br>Style: ${esc(db.settings.tone)}<br>POV: ${esc(db.settings.pov)}</div><button class="btn" id="copy-brief">Copy scene brief</button>`;document.getElementById('copy-brief').onclick=()=>navigator.clipboard?.writeText(`Project: ${p?.title}\nGoal: ${goal}\nEmotional undercurrent: ${emotion}\nContinuity constraint: ${fact}\nStyle: ${db.settings.tone}\nPOV: ${db.settings.pov}`)}
if(a==='scan'){let p=active(),d=db.drafts.find(x=>x.project===p?.id),text=d?.body||document.getElementById('draft-body')?.value||'',notes=db.notes.filter(n=>n.project===p?.id),checks=[];checks.push(`Word count: ${wordCount(text)}.`);checks.push(`Project lore entries available: ${notes.length}.`);let names=notes.filter(n=>n.type==='Character').map(n=>n.name);checks.push(names.length?`Character names to compare manually: ${names.join(', ')}.`:'No character entries saved for this project yet.');let lines=text.split(/\n+/).filter(x=>x.trim()),repeated=lines.filter((x,i)=>lines.findIndex(y=>y.trim().toLowerCase()===x.trim().toLowerCase())!==i);checks.push(repeated.length?`Exact repeated lines detected: ${repeated.length}.`:'No exact repeated lines detected.');document.getElementById('scan-result').innerHTML=`<div class="notice">${checks.map(esc).join('<br>')}<br><br>This is a basic text scan, not semantic AI continuity analysis.</div>`}
}
render();
</script>
</body>
</html>
